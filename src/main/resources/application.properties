spring.application.name=ecomm
spring.config.import=optional:file:.env[.properties]
groq.api-key=${GROQ_API_KEY}
spring.datasource.url=jdbc:mysql://localhost:3306/productcatalogservicetest

# In Prod we shouldn't have a root/admin user for the SQL connection.
spring.datasource.username=root

# We should not keep password in code.
spring.datasource.password=rahul999

# We don't want this!
spring.jpa.hibernate.ddl-auto=update

# It will be slow - and might leak out queries in logs.
spring.jpa.show-sql=true

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}